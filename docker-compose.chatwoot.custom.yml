# Dùng source từ fork Harry-Kien/chatwoot thay cho image dựng sẵn.
#
# Chỉ bật file override này khi đang phát triển hoặc đã chủ động build/test:
#   docker compose -f docker-compose.chatwoot.yml \
#     -f docker-compose.chatwoot.custom.yml build
#   docker compose -f docker-compose.chatwoot.yml \
#     -f docker-compose.chatwoot.custom.yml up -d
#
# Cả ba service dùng cùng một image nên source, migration và worker luôn
# cùng phiên bản. Không trộn Rails custom với Sidekiq từ image upstream.
x-chatwoot-custom: &chatwoot-custom
  image: harry-kien/chatwoot-custom:local
  build:
    context: ./chatwoot-personal
    dockerfile: docker/Dockerfile
    args:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"

services:
  migrate:
    <<: *chatwoot-custom
  rails:
    <<: *chatwoot-custom
  sidekiq:
    <<: *chatwoot-custom
