server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # Phục vụ tệp tĩnh từ volume assets RIÊNG, không đi qua `sites/assets`.
    #
    # `sites/assets` trong ảnh frappe là SYMLINK trỏ tới
    # /home/frappe/frappe-bench/assets — đường dẫn không tồn tại trong
    # container nginx. Đi theo nó thì mọi tệp trả 404 và trang hiện ra dạng
    # HTML thô, không CSS, ảnh vỡ. Backend cũng KHÔNG phục vụ được assets ở
    # chế độ production, nên proxy sang đó cũng không cứu.
    location /assets/ {
        alias /var/www/html/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://erpnext-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name localhost;
        proxy_read_timeout 120s;
    }
}
