<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kien Omnichannel — demo web chat</title>
  <style>
    :root { color-scheme:light; font:15px/1.65 "Segoe UI",system-ui,sans-serif; color:#142044; background:#f6f8fc; }
    * { box-sizing:border-box; } body { margin:0; }
    main { max-width:760px; margin:auto; padding:64px 24px 120px; }
    h1 { margin:0 0 8px; font-size:32px; letter-spacing:-.03em; }
    p { color:#5c6882; }.card { margin-top:30px; padding:22px; border:1px solid #dce3f0; border-radius:16px; background:#fff; }
    code { padding:2px 5px; border-radius:5px; background:#eef2f8; }
  </style>
</head>
<body>
  <main>
    <h1>Demo web chat first-party</h1>
    <p>Trang này dùng widget native của Kien Omnichannel. Tin nhắn đi thẳng vào
      inbox hợp nhất và giữ đúng account website.</p>
    <section class="card">
      <h2>Trước khi thử</h2>
      <p>Tạo account Web chat trong màn <b>Kết nối</b>, sau đó thay
        <code>YOUR_WEBCHAT_ACCOUNT_UUID</code> ở cuối file bằng UUID account đó.</p>
    </section>
  </main>
  <script src="/widget.js" data-account-id="YOUR_WEBCHAT_ACCOUNT_UUID"></script>
</body>
</html>
