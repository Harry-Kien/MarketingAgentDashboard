# GHIM ẢNH BẰNG DIGEST, KHÔNG DÙNG THẺ
# ------------------------------------
# Trước đây Chatwoot dùng `chatwoot/chatwoot:latest`. Thẻ `latest` không
# phải một phiên bản — nó là con trỏ, và nó DI CHUYỂN. Nghĩa là hai máy
# chạy cùng file này, cùng một ngày, có thể chạy hai bản Chatwoot khác
# nhau; và `docker compose pull` bất kỳ lúc nào cũng có thể kéo về một bản
# mới mang theo DI TRÚ CSDL KHÔNG LÙI ĐƯỢC.
#
# Với một ứng dụng đang giữ toàn bộ hộp thư khách hàng, đó không phải rủi
# ro chấp nhận được.
#
# Digest `sha256:...` thì bất biến: cùng chuỗi ấy là cùng đúng những byte
# ấy, mãi mãi. Thẻ cũ giữ lại trong chú thích vì digest không đọc được
# bằng mắt, mà người vận hành cần biết mình đang chạy phiên bản nào.
#
# Nâng cấp là việc CÓ CHỦ Ý: đọc changelog, sao lưu, đổi digest, thử.
#   docker pull chatwoot/chatwoot:latest
#   docker image inspect chatwoot/chatwoot:latest --format '{{index .RepoDigests 0}}'
#
# ============================================================
#  Hạ tầng phụ trợ cho Marketing Agent
#  ZaloCRM chạy compose RIÊNG của nó (không sửa, giữ AGPL tách bạch).
#  File này dựng: Postgres+pgvector, n8n, Langfuse (tuỳ chọn).
# ============================================================
name: marketing-agent

services:
  # --- Postgres + pgvector: RAG, hội thoại, chi phí, video ----
  db:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b   # pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: marketing_agent
    ports:
      # BUỘC VỀ 127.0.0.1 — cùng lý do đã ghi ở khối n8n bên dưới.
      #
      # Trước đây dòng này là "5433:5432", tức bind 0.0.0.0, tức mở CSDL ra
      # cả mạng LAN — với `agent/agent` làm đăng nhập, và đi vòng qua
      # Windows Firewall nên không hộp thoại nào hỏi. Bảng này giữ toàn bộ
      # hội thoại khách, đơn hàng và hồ sơ Customer 360.
      #
      # `scripts/san_sang` bắt được ngay lần đầu CSDL chạy thật. Test canh
      # việc này: tests/test_cong_khong_ra_lan.py
      #
      # 5433 (thay vì 5432) để không đụng Postgres của ZaloCRM.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d marketing_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- n8n: đường đăng bài mặc định + định tuyến báo động ------
  # BẬT THEO MẶC ĐỊNH, khác Langfuse ngay bên dưới. Lý do khác nhau:
  # Langfuse chỉ hiển thị lại số liệu đã có sẵn trong bảng `messages`, tắt
  # đi không mất gì. n8n thì nằm trên đường đi của HAI chức năng chính —
  # nó là nấc đầu trong chuỗi tụt bậc đăng bài (n8n -> API chính thức ->
  # hàng đợi thủ công), và là nơi `CANH_GAC_WEBHOOK` trỏ tới để báo động
  # đi được ra Zalo/Telegram. Không có nó thì bài luôn rơi xuống hàng đợi
  # thủ công và báo động chỉ ghi vào nhật ký.
  #
  # VÌ SAO PHẢI THÊM VÀO ĐÂY: README và docs/phan-phoi-noi-dung.md đều viết
  # "n8n đã chạy sẵn ở cổng 5678" và bảo người dùng mở trang đó ở bước đầu.
  # Nhưng không có gì trong repo khởi động nó — trên máy vừa clone, cổng
  # 5678 chết, hướng dẫn đứt ngay bước 1, và màn Sức khoẻ hệ thống hiện một
  # ô đỏ vĩnh viễn. Một bảng giám sát luôn đỏ là bảng người ta ngừng đọc.
  n8n:
    # Digest lấy từ registry Docker Hub, không phải chép tay. Kiểm chứng:
    #   docker image inspect n8nio/n8n:2.36.5 --format '{{index .RepoDigests 0}}'
    #
    # Bằng chứng sống cho luật ghim ở đầu file: lúc thêm dòng này, `latest`
    # trỏ vào sha256:166d7e3c… còn `2.36.5` là sha256:2cf92b86… — HAI ảnh
    # khác nhau. Ai dùng `latest` hôm nay và ai dùng `latest` tháng sau đang
    # chạy hai hệ thống khác nhau mà không biết.
    image: n8nio/n8n@sha256:2cf92b86cb9d36def87b6d7abc19f6ec882f397c4f489248f170e3b782a810fc   # n8nio/n8n:2.36.5
    ports:
      # BUỘC VỀ 127.0.0.1, không để "5678:5678".
      #
      # Docker bind `0.0.0.0` theo mặc định, nghĩa là mở ra CẢ MẠNG LAN —
      # và nó đi vòng qua Windows Firewall, nên không có hộp thoại nào hỏi.
      # Ai ngồi chung WiFi cũng mở được n8n, mà n8n giữ OAuth Facebook,
      # Instagram, TikTok của cửa hàng.
      #
      # Chỉ cổng 8000 (lớp proxy có chốt đăng nhập) được ra ngoài; mọi dịch
      # vụ nội bộ vào qua đó. `scripts/san_sang` canh đúng việc này và đã
      # bắt được lỗi ngay lần chạy đầu sau khi thêm n8n.
      - "127.0.0.1:5678:5678"
    environment:
      # Hẹn giờ đăng bài tính theo giờ Việt Nam. Để UTC thì bài hẹn 8 giờ
      # sáng đi lúc 3 giờ chiều, và không có gì báo là sai.
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      # URL n8n in ra cho node Webhook. Sai thì Production URL người dùng
      # copy về dán vào .env trỏ đi đâu không rõ.
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      # Ổ ĐĨA NÀY GIỮ OAUTH CỦA FACEBOOK/INSTAGRAM/TIKTOK, và cả khoá mã
      # hoá mà n8n tự sinh để đọc chúng. Mất nó là phải nối lại quyền cho
      # từng nền tảng bằng tay — thứ mất 1-4 tuần chờ duyệt để có.
      # `scripts/sao_luu.py` KHÔNG sao lưu ổ đĩa Docker; nếu bạn đã nối
      # OAuth thật thì phải sao lưu riêng volume này.
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --- Langfuse: trace, chi phí, dataset eval -----------------
  # --- Langfuse: TẮT theo mặc định ---------------------------------
  # Nằm trong profile "trace" nên `docker compose up -d` KHÔNG khởi động nó.
  # Bật khi cần:  docker compose --profile trace up -d
  #
  # Vì sao tắt: nó chỉ nhận dữ liệu khi LANGFUSE_PUBLIC_KEY/SECRET_KEY được
  # điền, mà lấy hai khoá đó phải tự tạo tài khoản trong giao diện của nó.
  # Chạy mà không nhận gì thì tốn ~195MB RAM để làm nền. Số liệu token, chi
  # phí và độ trễ đã có sẵn trong bảng `messages` và hiện ở màn Số hiệu —
  # xem GET /api/cost.
  langfuse_db:
    profiles: ["trace"]
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685   # postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    profiles: ["trace"]
    image: langfuse/langfuse@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015   # langfuse/langfuse:2
    depends_on:
      langfuse_db:
        condition: service_healthy
    ports:
      # Buộc về localhost như mọi dịch vụ nội bộ khác. Langfuse giữ toàn bộ
      # nội dung hội thoại đã gửi cho model — đó là dữ liệu khách hàng.
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse_db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: YXWsMcSlaniTuwCEnqoUlyNyQUlh3XayCx-VhxvqTT0
      SALT: 4dd3919d16f40dd8d32bf6c3cbcf245c
      ENCRYPTION_KEY: c73e91a32127089b4fcd92652fd7d3a1e8563c995515c45862cd8219a473efa3
      TELEMETRY_ENABLED: "false"

volumes:
  db_data:
  langfuse_data:
  n8n_data:

# ------------------------------------------------------------
#  viet-tts chạy riêng — theo README của repo, image/tag có thể
#  đổi theo phiên bản nên KHÔNG pin cứng ở đây:
#
#    git clone https://github.com/dangvansam/viet-tts
#    cd viet-tts && docker compose up -d
#
#  Sau đó đặt TTS_BASE_URL trong .env trỏ tới cổng nó mở
#  (mặc định repo dùng 8298, API tương thích chuẩn OpenAI TTS).
#  Chưa có TTS thì hệ thống vẫn chạy: video sẽ dùng thời lượng
#  ước lượng theo số âm tiết (xem agent/video/timing.py).
# ------------------------------------------------------------
