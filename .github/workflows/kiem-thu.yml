# Chạy bộ kiểm thử mỗi lần push và mỗi pull request.
#
# CHỈ chạy phần tất định — 432 ca trong tests/, không gọi API nào.
# Bộ 56 câu hỏi vàng (scripts/eval.py) KHÔNG chạy ở đây, có chủ đích:
# nó gọi Vertex AI thật, tốn tiền, mất 13 phút, và không tất định (bốn lần
# chạy liên tiếp cho 51, 55, 52, 54 điểm). Một CI đỏ ngẫu nhiên thì người
# ta ngừng đọc CI. Bộ vàng để đo chất lượng, chạy tay khi sửa prompt.

name: Kiểm thử

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        # Phiên bản đã ghim bằng == trong requirements.txt, nên lần chạy này
        # dùng đúng tổ hợp đã kiểm trên máy phát triển.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy kiểm thử
        run: python -m pytest tests/ -q

      - name: Kiểm mọi module import được
        # pytest chỉ chạm tới module nào test import. Bước này bắt lỗi cú
        # pháp và import vòng ở những file chưa có test — đã xảy ra thật khi
        # một dấu xuống dòng lọt vào chuỗi regex.
        run: |
          python - <<'PY'
          import importlib, sys
          mods = [
              "agent.main", "agent.config", "agent.db", "agent.runtime",
              "agent.core.agent", "agent.core.llm", "agent.core.rag",
              "agent.core.tools", "agent.core.tu_nhien",
              "agent.core.du_lieu_ca_nhan",
              "agent.core.gio_lam_viec", "agent.core.cham_nhieu_luot",
              "agent.core.xac_thuc", "agent.suc_khoe", "agent.canh_gac",
              "agent.channels.base", "agent.channels.registry",
              "agent.channels.zalocrm", "agent.channels.chatwoot",
              "agent.channels.zalocrm_accounts",
              "agent.publish.base", "agent.publish.registry",
              "agent.publish.service", "agent.publish.analytics",
              "agent.publish.copywriter", "agent.publish.chien_dich",
              "agent.publish.n8n", "agent.publish.meta", "agent.publish.tiktok",
              "agent.publish.manual",
              "agent.video.pipeline", "agent.video.worker",
              "agent.api.routes", "agent.mcp_server",
          ]
          hong = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  hong.append(f"{m}: {type(e).__name__}: {e}")
          for h in hong:
              print("HỎNG", h)
          print(f"{len(mods) - len(hong)}/{len(mods)} module import sạch")
          sys.exit(1 if hong else 0)
          PY

      - name: Chặn bí mật lọt vào repo
        # .gitignore đã chặn .env, nhưng một lần `git add -f` là đủ để lộ.
        # Kiểm ở đây vì lộ khoá API thì không rút lại được.
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.chatwoot$'; then
            echo "LỖI: file .env bị theo dõi trong git"
            exit 1
          fi
          echo "Không có file bí mật nào bị theo dõi"

      - name: Soi lỗi tĩnh (ruff)
        # Chỉ bắt LỖI, không bắt phong cách — xem ruff.toml. Bật bộ phong
        # cách vào đây là hàng nghìn cảnh báo, người ta tắt linter đi, rồi
        # mất luôn phần bắt lỗi thật.
        run: |
          pip install ruff
          ruff check .

      - name: Dò lỗ hổng đã biết trong thư viện
        # 17 thư viện ghim cứng bằng ==. Ghim là tốt cho tính lặp lại, nhưng
        # nó cũng nghĩa là một CVE công bố hôm nay sẽ nằm im trong repo cho
        # tới khi có người tình cờ nâng cấp. Bước này bắt CI nói ra.
        #
        # continue-on-error: một CVE mới công bố không được làm đỏ CI của
        # người đang sửa việc khác. Nó phải HIỆN RA, không phải CHẶN LẠI.
        continue-on-error: true
        #
        # Quét MÔI TRƯỜNG ĐÃ CÀI, không quét `requirements.txt`. Hai lý do:
        # nó bao luôn thư viện phụ thuộc gián tiếp (chỗ CVE hay nằm), và bộ
        # đọc requirements của pip-audit vấp chú thích tiếng Việt trên máy
        # có locale không phải UTF-8.
        run: |
          pip install pip-audit
          pip-audit --desc

  # ===============================================================
  #  Máy vừa clone repo có chạy được không
  # ===============================================================
  # Job RIÊNG, checkout SẠCH, không dùng lại gì của job trên.
  #
  # VÌ SAO CẦN: đã xảy ra thật. `_tu_khoa_loai_da()` đọc thẳng
  # `data/catalog.json` — file KHÔNG lên repo. Trên máy phát triển nó có,
  # nên 380 test xanh. Trên máy vừa clone nó không có, và 7 test đỏ kèm một
  # tính năng chết câm: hồ sơ khách ngừng ghi loại da.
  #
  # Lỗi loại này vô hình với người viết mã, vì máy họ luôn có sẵn dữ liệu
  # thật. Chỉ một lần clone sạch mới lộ ra.
  clone-sach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # submodule không cần cho test của repo này

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Không được có dữ liệu thật trong bản clone
        # Nếu một trong các file này lọt lên repo thì job này mất hết ý
        # nghĩa — nó sẽ chạy trên máy CÓ dữ liệu, y như máy phát triển.
        run: |
          for f in data/catalog.json data/knowledge; do
            if [ -e "$f" ]; then
              echo "LỖI: $f có trong repo — job clone sạch thành vô nghĩa"
              exit 1
            fi
          done
          echo "Bản clone đúng là sạch: chỉ có dữ liệu mẫu"

      - name: Chạy kiểm thử trên bản clone sạch
        run: python -m pytest tests/ -q

