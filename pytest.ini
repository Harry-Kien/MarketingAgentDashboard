[pytest]
# VÌ SAO CẦN FILE NÀY
# -------------------
# `pytest` gõ trần (không kèm `tests/`) trước đây VỠ NGAY lúc thu thập:
#
#   OSError: [WinError 1920] The file cannot be accessed by the system:
#   'ZaloCRM/backups/weekly/zalocrm-latest.sql.gz'
#
# pytest bò vào submodule ZaloCRM, gặp các đường dẫn sao lưu mà Windows
# không đọc được, rồi dừng toàn bộ. CI thoát được vì gọi đúng `pytest
# tests/` — nhưng người vừa clone repo về thì gõ `pytest`, thấy màn hình
# đỏ, và kết luận hệ thống hỏng.
#
# Bộ kiểm thử của DỰ ÁN NÀY nằm trong `tests/`. Mã của ZaloCRM là repo
# của người khác, dưới giấy phép của người khác — test của họ không phải
# việc của CI này.
testpaths = tests
norecursedirs = ZaloCRM .venv .git data video-studio dashboard
