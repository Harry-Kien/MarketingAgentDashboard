name: nexterp

services:
  erpnext-db:
    image: mariadb:10.6
    container_name: erpnext-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: erpnext_root_password
      MYSQL_DATABASE: _erpnext
      MYSQL_USER: erpnext_user
      MYSQL_PASSWORD: erpnext_password
    volumes:
      - erpnext_db_data:/var/lib/mysql
    networks:
      - erpnext-net

  erpnext-redis-cache:
    image: redis:6.2-alpine
    container_name: erpnext-redis-cache
    restart: unless-stopped
    networks:
      - erpnext-net

  erpnext-redis-queue:
    image: redis:6.2-alpine
    container_name: erpnext-redis-queue
    restart: unless-stopped
    networks:
      - erpnext-net

  erpnext-web:
    image: frappe/erpnext:v15
    container_name: erpnext-web
    restart: unless-stopped
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: erpnext_root_password
    volumes:
      - erpnext_sites_data:/home/frappe/frappe-bench/sites
      # ASSETS RA MỘT VOLUME RIÊNG — đây là chỗ sửa lỗi vỡ giao diện.
      #
      # Trong ảnh frappe, `sites/assets` là SYMLINK trỏ tới
      # `/home/frappe/frappe-bench/assets`. Nginx mount `sites` rồi đi theo
      # symlink đó vào một đường dẫn KHÔNG tồn tại trong container nginx,
      # nên mọi tệp tĩnh trả 404 và trang hiện ra dạng HTML thô.
      #
      # Docker tự chép nội dung thư mục trong ảnh vào volume rỗng ở lần
      # mount đầu, nên nginx mount cùng volume này là thấy TỆP THẬT, không
      # còn phụ thuộc symlink.
      #
      # Vì sao không dùng cách chép tay `cp -rL` như tài liệu cũ: entrypoint
      # của ảnh tạo LẠI symlink mỗi lần khởi động ("Linking fresh assets to
      # volume" trong log), nên bản vá ấy mất sau mỗi `docker compose
      # restart` — và người ta phải nhớ chạy lại một lệnh mà không có gì
      # nhắc.
      - erpnext_assets_data:/home/frappe/frappe-bench/assets
      # Và `apps` nữa — symlink còn một tầng sâu hơn.
      #
      # `assets/frappe` KHÔNG phải thư mục mà là symlink tới
      # `/home/frappe/frappe-bench/apps/frappe/frappe/public`; `assets/erpnext`
      # tương tự. Mount mỗi `assets` là nginx thấy hai symlink gãy tiếp.
      #
      # Mount `apps` ở ĐÚNG đường dẫn tuyệt đối đó trong cả hai container thì
      # symlink phân giải được, không cần sửa gì trong ảnh.
      - erpnext_apps_data:/home/frappe/frappe-bench/apps
    depends_on:
      - erpnext-db
      - erpnext-redis-cache
      - erpnext-redis-queue
    networks:
      - erpnext-net

  erpnext-proxy:
    image: nginx:alpine
    container_name: erpnext-proxy
    restart: unless-stopped
    ports:
      # BUỘC VỀ 127.0.0.1, không để "8080:80".
      #
      # Docker bind `0.0.0.0` theo mặc định, nghĩa là mở ra CẢ MẠNG LAN —
      # và nó đi vòng qua Windows Firewall, nên không hộp thoại nào hỏi.
      # ERPNext giữ danh mục, giá vốn, đơn hàng và thông tin khách; ai ngồi
      # chung WiFi cũng mở được nếu để nguyên.
      #
      # Cùng lý do đã ghi cho Postgres, n8n và Langfuse trong
      # `docker-compose.yml`. File này về sau nên giữ đúng quy ước đó.
      - "127.0.0.1:8080:80"
    volumes:
      - erpnext_sites_data:/var/www/html/sites:ro
      # Cùng volume assets với erpnext-web, chỉ đọc. Nginx phục vụ tệp
      # thật ở đây thay vì đi theo symlink gãy trong `sites/`.
      - erpnext_assets_data:/var/www/html/assets:ro
      # Mount ở ĐÚNG đường dẫn mà symlink trong assets trỏ tới. Đặt chỗ khác
      # là symlink vẫn gãy — chúng là đường dẫn TUYỆT ĐỐI.
      - erpnext_apps_data:/home/frappe/frappe-bench/apps:ro
      - ./nginx.erpnext.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - erpnext-web
    networks:
      - erpnext-net

networks:
  erpnext-net:
    driver: bridge

volumes:
  erpnext_db_data:
  erpnext_sites_data:
  erpnext_assets_data:
  erpnext_apps_data:
