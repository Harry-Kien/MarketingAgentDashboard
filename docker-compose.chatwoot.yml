# GHIM ẢNH BẰNG DIGEST, KHÔNG DÙNG THẺ
# ------------------------------------
# Trước đây Chatwoot dùng `chatwoot/chatwoot:latest`. Thẻ `latest` không
# phải một phiên bản — nó là con trỏ, và nó DI CHUYỂN. Nghĩa là hai máy
# chạy cùng file này, cùng một ngày, có thể chạy hai bản Chatwoot khác
# nhau; và `docker compose pull` bất kỳ lúc nào cũng có thể kéo về một bản
# mới mang theo DI TRÚ CSDL KHÔNG LÙI ĐƯỢC.
#
# Với một ứng dụng đang giữ toàn bộ hộp thư khách hàng, đó không phải rủi
# ro chấp nhận được.
#
# Digest `sha256:...` thì bất biến: cùng chuỗi ấy là cùng đúng những byte
# ấy, mãi mãi. Thẻ cũ giữ lại trong chú thích vì digest không đọc được
# bằng mắt, mà người vận hành cần biết mình đang chạy phiên bản nào.
#
# Nâng cấp là việc CÓ CHỦ Ý: đọc changelog, sao lưu, đổi digest, thử.
#   docker pull chatwoot/chatwoot:latest
#   docker image inspect chatwoot/chatwoot:latest --format '{{index .RepoDigests 0}}'
#
# Chatwoot — hộp thư đa nền tảng (Facebook, Instagram, WhatsApp, web, email)
#
# Tách khỏi docker-compose.yml chính vì đây là hệ thống độc lập, có CSDL và
# Redis riêng. Bật/tắt không ảnh hưởng agent:
#     docker compose -f docker-compose.chatwoot.yml up -d
#     docker compose -f docker-compose.chatwoot.yml down
#
# CỔNG — chọn tránh mọi thứ đang chạy trên máy này:
#     3200  Chatwoot web      (3000 ZaloCRM nội bộ, 3001 Langfuse, 3080 ZaloCRM)
#     5435  Postgres riêng    (5433 agent, 5434 ZaloCRM)
#     6380  Redis riêng       (6379 ZaloCRM)
#
# Chatwoot >= 3.x cần pgvector cho tính năng tìm kiếm ngữ nghĩa của nó.

name: chatwoot

services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b   # pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot_local_pw
    volumes:
      - chatwoot_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2   # redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "chatwoot_local_pw"]
    volumes:
      - chatwoot_redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chatwoot_local_pw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Chạy migration rồi thoát. Các service khác chờ nó xong mới khởi động —
  # nếu không, rails và sidekiq cùng chạy migration một lúc và giẫm lên nhau.
  migrate:
    image: chatwoot/chatwoot@sha256:f85da9b40ebe81d7f4b1a138c7d857cd7a71762f3c75a2c858ed4d9a46e5f4b1   # chatwoot/chatwoot:latest
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    env_file: .env.chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  rails:
    image: chatwoot/chatwoot@sha256:f85da9b40ebe81d7f4b1a138c7d857cd7a71762f3c75a2c858ed4d9a46e5f4b1   # chatwoot/chatwoot:latest
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    env_file: .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Sidekiq xử lý việc nền: gửi tin ra nền tảng, gửi email, chạy automation.
  # Thiếu nó thì giao diện vẫn lên nhưng tin nhắn không bao giờ đi.
  sidekiq:
    image: chatwoot/chatwoot@sha256:f85da9b40ebe81d7f4b1a138c7d857cd7a71762f3c75a2c858ed4d9a46e5f4b1   # chatwoot/chatwoot:latest
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    env_file: .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  # GHIM tên volume tuyệt đối.
  #
  # Mặc định Docker đặt tên volume theo <tên project>_<tên volume>. Tên
  # project lấy từ tên thư mục, nên chỉ cần đổi tên thư mục, gộp file này
  # vào docker-compose.yml, hay chạy bằng `-p` khác là volume thành một cái
  # KHÁC — rỗng. Hộp thư, kết nối OAuth và toàn bộ lịch sử khách trông như
  # biến mất, dù dữ liệu vẫn nằm nguyên trong volume cũ.
  #
  # Ghim tên rồi thì dữ liệu bám vào volume chứ không bám vào tên thư mục.
  chatwoot_pg:
    name: chatwoot_chatwoot_pg
  chatwoot_redis:
    name: chatwoot_chatwoot_redis
  chatwoot_storage:
    name: chatwoot_chatwoot_storage
