# ============================================================
#  Hạ tầng phụ trợ cho Marketing Agent
#  ZaloCRM chạy compose RIÊNG của nó (không sửa, giữ AGPL tách bạch).
#  File này chỉ dựng: Postgres+pgvector, Langfuse, viet-tts.
# ============================================================
name: marketing-agent

services:
  # --- Postgres + pgvector: RAG, hội thoại, chi phí, video ----
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: marketing_agent
    ports:
      - "5433:5432"          # 5433 để không đụng Postgres của ZaloCRM
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d marketing_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Langfuse: trace, chi phí, dataset eval -----------------
  # --- Langfuse: TẮT theo mặc định ---------------------------------
  # Nằm trong profile "trace" nên `docker compose up -d` KHÔNG khởi động nó.
  # Bật khi cần:  docker compose --profile trace up -d
  #
  # Vì sao tắt: nó chỉ nhận dữ liệu khi LANGFUSE_PUBLIC_KEY/SECRET_KEY được
  # điền, mà lấy hai khoá đó phải tự tạo tài khoản trong giao diện của nó.
  # Chạy mà không nhận gì thì tốn ~195MB RAM để làm nền. Số liệu token, chi
  # phí và độ trễ đã có sẵn trong bảng `messages` và hiện ở màn Số hiệu —
  # xem GET /api/cost.
  langfuse_db:
    profiles: ["trace"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    profiles: ["trace"]
    image: langfuse/langfuse:2
    depends_on:
      langfuse_db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse_db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: YXWsMcSlaniTuwCEnqoUlyNyQUlh3XayCx-VhxvqTT0
      SALT: 4dd3919d16f40dd8d32bf6c3cbcf245c
      ENCRYPTION_KEY: c73e91a32127089b4fcd92652fd7d3a1e8563c995515c45862cd8219a473efa3
      TELEMETRY_ENABLED: "false"

volumes:
  db_data:
  langfuse_data:

# ------------------------------------------------------------
#  viet-tts chạy riêng — theo README của repo, image/tag có thể
#  đổi theo phiên bản nên KHÔNG pin cứng ở đây:
#
#    git clone https://github.com/dangvansam/viet-tts
#    cd viet-tts && docker compose up -d
#
#  Sau đó đặt TTS_BASE_URL trong .env trỏ tới cổng nó mở
#  (mặc định repo dùng 8298, API tương thích chuẩn OpenAI TTS).
#  Chưa có TTS thì hệ thống vẫn chạy: video sẽ dùng thời lượng
#  ước lượng theo số âm tiết (xem agent/video/timing.py).
# ------------------------------------------------------------
